<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 724" width="1040" height="724" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
